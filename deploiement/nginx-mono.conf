# Configuration nginx de l'image combinée (une seule app CapRover).
#
# L'API tourne dans LE MÊME conteneur : on relaie donc vers 127.0.0.1:3000, et
# non vers un service CapRover. Pour la topologie en deux apps, voir
# web/nginx.conf.
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;

  # Compression : la table de saisie est volumineuse en HTML comme en JSON.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Les photos de poches et les pièces jointes peuvent être lourdes.
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Application monopage : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Les assets portent une empreinte dans leur nom : cache long sans risque.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html ne doit jamais être mis en cache, sinon un déploiement
  # n'atteint pas les postes déjà ouverts.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }
}
