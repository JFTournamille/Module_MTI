# Configuration nginx de l'image combinée (une seule app CapRover).
#
# L'API tourne dans LE MÊME conteneur : on relaie donc vers 127.0.0.1:3000, et
# non vers un service CapRover. Pour la topologie en deux apps, voir
# web/nginx.conf.
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;

  # ── Ce que les en-têtes ne doivent pas dire ────────────────────────────────
  # `server_tokens off` retire le numéro de version de nginx de l'en-tête
  # `Server` et des pages d'erreur : une version connue est une liste de failles
  # connues.
  server_tokens off;

  # Un outil en phase de test n'a pas à être indexé. L'en-tête vaut pour toutes
  # les réponses, y compris les JSON de l'API — un robots.txt ne couvre que ce
  # qu'il déclare, et ne s'applique pas aux liens partagés.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # Le navigateur ne doit pas renifler le type d'un contenu ni laisser la page
  # être encadrée par un tiers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Le `Referer` ne doit pas emporter le domaine réel vers un site tiers si un
  # lien sort de l'application.
  add_header Referrer-Policy "same-origin" always;

  # ── Porte d'entrée de la phase de test ─────────────────────────────────────
  # Fichier écrit au démarrage par deploiement/acces-basique.sh, quand
  # ACCES_UTILISATEUR et ACCES_MOT_DE_PASSE sont renseignés ; absent sinon. Le
  # joker tolère un répertoire vide : sans variables, aucune porte, et la
  # configuration reste la même.
  #
  # `auth_basic` est hérité par les `location`, contrairement à `add_header` :
  # l'API, les assets et index.html sont donc couverts sans rien répéter.
  include /etc/nginx/acces.d/*.conf;

  # Compression : la table de saisie est volumineuse en HTML comme en JSON.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Les photos de poches et les pièces jointes peuvent être lourdes.
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Application monopage : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Les assets portent une empreinte dans leur nom : cache long sans risque.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # `add_header` n'est PAS hérité : un `location` qui en déclare un perd
    # tous ceux du niveau serveur. Les en-têtes de discrétion sont donc
    # répétés ici — sans quoi ils manqueraient précisément sur index.html et
    # sur les assets, les deux ressources que tout le monde charge.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # index.html ne doit jamais être mis en cache, sinon un déploiement
  # n'atteint pas les postes déjà ouverts.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    # `add_header` n'est PAS hérité : un `location` qui en déclare un perd
    # tous ceux du niveau serveur. Les en-têtes de discrétion sont donc
    # répétés ici — sans quoi ils manqueraient précisément sur index.html et
    # sur les assets, les deux ressources que tout le monde charge.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
