# Développement local uniquement.
#
# En production, chaque service est une app CapRover distincte : la base est
# une one-click app PostgreSQL, `api` et `web` sont déployées depuis ce dépôt
# via leur captain-definition respectif. Ce fichier reproduit le même câblage
# sur un poste de travail.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mti_dev}
    ports: ['5432:5432']
    volumes: ['mti_db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mti']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-mti_dev}@db:5432/mti
      NODE_ENV: development
      AUTH_MODE: dev
      DEV_UTILISATEUR_ID: ${DEV_UTILISATEUR_ID:-}
      LOG_LEVEL: info
    ports: ['3000:3000']
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # Vides par défaut : en local, aucune porte à l'entrée. Les renseigner
      # permet d'éprouver la porte avant de la poser sur le serveur de test.
      ACCES_UTILISATEUR: ${ACCES_UTILISATEUR:-}
      ACCES_MOT_DE_PASSE: ${ACCES_MOT_DE_PASSE:-}
    ports: ['8080:80']
    depends_on: [api]

volumes:
  mti_db:
