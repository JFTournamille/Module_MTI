server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Compression : la table de saisie est volumineuse en HTML comme en JSON.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # L'API est servie par un autre conteneur CapRover. Le nom d'hôte suit la
  # convention srv-captain--<nom-de-l-app> ; il est injecté au démarrage via
  # la variable API_HOST (cf. docker-compose.yml pour l'équivalent local).
  location /api/ {
    proxy_pass http://srv-captain--mti-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Application monopage : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Les assets portent une empreinte dans leur nom : cache long sans risque.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html ne doit jamais être mis en cache, sinon un déploiement ne
  # parvient pas aux postes déjà ouverts.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }
}
